  <!-- mini circuit -->
  <rect x="6" y="10" width="16" height="2" fill="#00e5ff" opacity="0.7"/>
  <rect x="20" y="10" width="2" height="12" fill="#00e5ff" opacity="0.7"/>
  <rect x="20" y="20" width="10" height="2" fill="#00e5ff" opacity="0.7"/>

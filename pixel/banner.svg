<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="Mamun banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0f16"/>
      <stop offset="50%" stop-color="#14151c"/>
      <stop offset="100%" stop-color="#0e0f16"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1c1e2a" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="880" height="200" fill="url(#bg)"/>
  <rect width="880" height="200" fill="url(#grid)" opacity="0.55"/>
  <!-- soft drifting cyan glows -->
  <g opacity="0.35" filter="url(#glow)">
    <circle cx="120" cy="90" r="48" fill="#00e5ff">
      <animate attributeName="cx" values="100;160;100" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.45;0.25" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="110" r="56" fill="#00bcd4">
      <animate attributeName="cy" values="90;130;90" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- circuit traces -->
  <g fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="square" opacity="0.75" filter="url(#glow)">
    <path d="M40 40 H180 V100 H260">
      <animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M840 50 H700 V120 H620">
      <animate attributeName="stroke-opacity" values="0.9;0.35;0.9" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M60 170 H200 V140 H320"/>
    <path d="M820 170 H680 V145 H560"/>
    <path d="M300 30 V70 H380 V40"/>
    <path d="M580 30 V75 H500"/>
  </g>
  <!-- nodes -->
  <g fill="#00e5ff" filter="url(#glow)">
    <rect x="176" y="36" width="8" height="8" opacity="0.9">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="256" y="96" width="8" height="8"/>
    <rect x="696" y="46" width="8" height="8">
      <animate attributeName="opacity" values="1;0.35;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="616" y="116" width="8" height="8"/>
    <rect x="196" y="166" width="8" height="8"/>
    <rect x="676" y="166" width="8" height="8"/>
    <rect x="376" y="36" width="8" height="8"/>
    <rect x="496" y="71" width="8" height="8"/>
  </g>
  <!-- center label plate -->
  <rect x="270" y="68" width="340" height="64" rx="2" fill="#14151c" stroke="#1f2433" stroke-width="1"/>
  <rect x="274" y="72" width="332" height="56" fill="#0e0f16" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1"/>
  <text x="440" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#f0f3f8" letter-spacing="6">MAMUN</text>
  <text x="440" y="120" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7a8799" letter-spacing="1.5">statistics · python · shipping small tools</text>
  <!-- bottom hairline pulse -->
  <rect x="0" y="196" width="880" height="2" fill="#00e5ff" opacity="0.35">
    <animate attributeName="opacity" values="0.15;0.55;0.15" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>

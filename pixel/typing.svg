<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="540" height="40" viewBox="0 0 540 40" role="img" aria-label="typing tagline">
  <rect width="540" height="40" fill="none"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#e8eef7">
    <!-- line 0: 0–3.2s visible -->
    <text id="l0" x="270" y="25" text-anchor="middle" opacity="0">Statistics undergrad
      <animate attributeName="opacity"
        values="0;1;1;0;0"
        keyTimes="0;0.02;0.24;0.27;1"
        dur="12s" repeatCount="indefinite"/>
    </text>
    <!-- line 1: 3.3–6.5s -->
    <text id="l1" x="270" y="25" text-anchor="middle" opacity="0">shipping small Python tools
      <animate attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.27;0.29;0.51;0.54;1"
        dur="12s" repeatCount="indefinite"/>
    </text>
    <!-- line 2: 6.6–9.8s -->
    <text id="l2" x="270" y="25" text-anchor="middle" opacity="0">learning data &amp; CS
      <animate attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.54;0.56;0.78;0.81;1"
        dur="12s" repeatCount="indefinite"/>
    </text>
    <!-- brief pause then loop; caret always blinks -->
  </g>
  <rect x="448" y="11" width="7" height="16" fill="#00e5ff">
    <animate attributeName="opacity" values="1;0;1" dur="0.85s" repeatCount="indefinite"/>
  </rect>
</svg>

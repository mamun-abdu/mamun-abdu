<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="16" viewBox="0 0 680 16" role="img" aria-label="pixel divider" shape-rendering="crispEdges">
  <rect width="680" height="16" fill="none"/>
  <!-- dashed pixel line -->
  <g fill="#00e5ff">
    <rect x="40" y="7" width="8" height="2" opacity="0.25"/>
    <rect x="56" y="7" width="8" height="2" opacity="0.4"/>
    <rect x="72" y="7" width="8" height="2" opacity="0.55"/>
    <rect x="88" y="7" width="480" height="2" opacity="0.7">
      <animate attributeName="opacity" values="0.4;0.95;0.4" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="576" y="7" width="8" height="2" opacity="0.55"/>
    <rect x="592" y="7" width="8" height="2" opacity="0.4"/>
    <rect x="608" y="7" width="8" height="2" opacity="0.25"/>
    <!-- center node -->
    <rect x="336" y="4" width="8" height="8" fill="#00e5ff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="338" y="6" width="4" height="4" fill="#b8f7ff"/>
    <!-- side nodes -->
    <rect x="120" y="5" width="4" height="4" fill="#007a8a"/>
    <rect x="556" y="5" width="4" height="4" fill="#007a8a"/>
  </g>
</svg>
